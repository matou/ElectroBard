<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElectroBard — Layers & Sets workspace prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --ink:#ede3d0; --muted:#9d9588; --dim:#6f695f; --bg:#12100d;
      --panel:#1a1713; --panel2:#211d18; --line:#3b342b; --amber:#d69a45;
      --cyan:#6da7a5; --rose:#bb7278; --danger:#e2796e; --ok:#88aa79;
      --serif:Palatino,Georgia,serif; --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--mono)}
    button,input,select{font:inherit} button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.38}
    .shell{min-height:100vh;padding-bottom:100px}.prototype-banner{background:#765328;color:#fff4df;padding:5px 20px;text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
    .appbar{height:66px;display:flex;align-items:center;gap:28px;padding:0 28px;border-bottom:1px solid var(--line);background:#171410;position:sticky;top:0;z-index:5}
    .brand{font:700 22px var(--serif);letter-spacing:.02em}.brand b{color:var(--amber)}
    .nav{display:flex;align-self:stretch}.nav button{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:0 18px}.nav button.active{color:var(--ink);border-color:var(--amber)}
    .nav .future{color:var(--dim)}.future-badge,.eyebrow,.count,.tag,.mode-pill{font-size:10px;letter-spacing:.08em;text-transform:uppercase}
    .future-badge{border:1px solid var(--line);border-radius:10px;padding:2px 6px;margin-left:5px}.appbar .spacer{flex:1}.reset{background:none;border:1px solid var(--line);color:var(--muted);padding:7px 10px;border-radius:4px}
    .pagehead{display:flex;align-items:end;justify-content:space-between;padding:28px 32px 20px;max-width:1500px;margin:auto}.pagehead h1{font:32px/1 var(--serif);margin:4px 0 7px}.pagehead p{margin:0;color:var(--muted);max-width:720px}.eyebrow{color:var(--amber)}
    .primary{border:0;border-radius:4px;background:var(--amber);color:#17110a;padding:9px 13px;font-weight:700}.secondary,.icon-btn{border:1px solid var(--line);border-radius:4px;background:var(--panel2);color:var(--ink);padding:8px 11px}.ghost{border:0;background:none;color:var(--muted);padding:7px}.danger{color:var(--danger)!important}.icon-btn{padding:4px 8px}.toolbar{display:flex;gap:8px;align-items:center}
    .workspace{max-width:1500px;margin:0 auto;padding:0 32px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}.panel-title{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
    .empty{text-align:center;padding:54px 24px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font:22px var(--serif);margin-bottom:7px}.empty .primary{margin-top:16px}
    .row{display:flex;align-items:center;gap:10px}.stack{display:flex;flex-direction:column;gap:10px}.title{font:20px var(--serif)}.subtle{color:var(--muted)}
    .tag{display:inline-flex;background:#2d2922;border:1px solid #494136;border-radius:12px;padding:3px 7px;color:#d4c8b4;margin:2px}.mode-pill{color:var(--cyan)}
    .grip{color:var(--dim);cursor:grab;letter-spacing:-3px}.order{display:flex;gap:3px}.order button{border:0;background:#2a251f;color:var(--muted);width:24px;height:24px;border-radius:3px}
    input[type=text],select{width:100%;background:#100e0c;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:9px}input[type=range]{accent-color:var(--amber)}
    label.field{display:block;color:var(--muted);margin-bottom:16px}.field>span:first-child{display:block;margin-bottom:6px;color:var(--muted)}.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0}.check input{margin-top:4px}.help{font-size:12px;color:var(--dim)}
    .membership{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.sound{padding:8px 0;border-bottom:1px solid #2c2822;display:flex;justify-content:space-between}.source{color:var(--dim);font-size:11px}.zero{padding:18px;border:1px dashed var(--line);color:var(--muted);text-align:center}
    .variant-note{position:fixed;right:18px;top:82px;width:240px;background:#242019f2;border:1px solid #594a37;border-radius:5px;padding:12px;z-index:8;box-shadow:0 8px 30px #0008}.variant-note strong{font-family:var(--serif);font-size:16px}.variant-note p{color:var(--muted);font-size:11px;margin:5px 0 0}.variant-note button{position:absolute;right:5px;top:4px;border:0;background:none;color:var(--muted)}
    /* A: three-pane workbench */
    .workbench{display:grid;grid-template-columns:230px minmax(320px,1fr) minmax(330px,430px);min-height:610px}.workbench>.pane{border-right:1px solid var(--line)}.workbench>.pane:last-child{border:0}.layer-item,.set-item{padding:12px 14px;border-bottom:1px solid #2d2923;cursor:pointer}.layer-item.active,.set-item.active{background:#2c261d;border-left:3px solid var(--amber);padding-left:11px}.layer-item:hover,.set-item:hover{background:#24201a}.item-top{display:flex;align-items:center;gap:8px}.item-top strong{flex:1}.layer-item .subtle,.set-item .subtle{font-size:11px;margin:4px 0 0 22px}.sets-head{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.inspector{padding:20px}.inspector h2{font:25px var(--serif);margin:2px 0 18px}.danger-zone{margin-top:25px;border-top:1px solid #53352f;padding-top:14px}.danger-zone p{font-size:12px;color:var(--muted)}
    /* B: expanded racks */
    .racks{display:flex;flex-direction:column;gap:14px}.rack{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:5px}.rack-head{display:grid;grid-template-columns:minmax(200px,1fr) 185px 170px auto;gap:20px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}.rack-head h2{font:23px var(--serif);margin:0}.rack-name{font:23px var(--serif)!important;border:0!important;background:transparent!important;padding:2px!important}.mini-field span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase}.sets-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;padding:12px}.set-card{background:#211d18;border:1px solid #40382f;border-radius:4px;padding:12px;min-height:128px}.set-card h3{font:17px var(--serif);margin:0}.set-card .card-top{display:flex;align-items:start;gap:8px}.set-card .card-top h3{flex:1}.set-card .membership-line{margin-top:18px;color:var(--muted);font-size:11px}.set-card.add{display:grid;place-items:center;border-style:dashed;color:var(--muted);background:transparent}.inline-confirm{background:#351f1d;border:1px solid #6f3934;padding:10px;margin-top:10px;font-size:11px}.inline-confirm .toolbar{margin-top:8px}.rack-empty{padding:28px;text-align:center;color:var(--muted)}
    /* C: outline + sheet */
    .outline-layout{display:grid;grid-template-columns:360px 1fr;gap:16px;min-height:610px}.tree{padding:8px}.tree-layer{margin-bottom:8px}.tree-row{display:flex;align-items:center;gap:7px;padding:9px;border-radius:4px}.tree-row:hover,.tree-row.active{background:#2a251e}.tree-row strong,.tree-row span.name{flex:1}.tree-set{margin-left:26px;border-left:1px solid var(--line);padding-left:7px}.tree-set .tree-row{font-size:12px}.sheet{padding:25px 30px}.sheet-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}.sheet h2{font:29px var(--serif);margin:3px 0}.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.sheet .membership{grid-column:1/-1}.breadcrumb{color:var(--muted);font-size:11px}.savebar{display:flex;justify-content:space-between;align-items:center;background:#211c16;border:1px solid #55452f;padding:10px 12px;margin-top:20px}.session-callout{border:1px dashed #514839;padding:20px;text-align:center;color:var(--muted)}
    /* prototype chrome */
    .switcher{position:fixed;z-index:20;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;background:#f0e6d3;color:#17120d;border-radius:30px;padding:6px;box-shadow:0 10px 35px #000b}.switcher button{border:0;background:#2a2118;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px}.switcher .variant-label{min-width:250px;text-align:center;font-weight:700}.switcher small{display:block;font-weight:400;color:#6c6256}.state-toggle{position:fixed;z-index:19;bottom:24px;right:18px;background:#2a251e;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:8px 10px}.state-panel{position:fixed;z-index:18;right:18px;bottom:70px;width:min(440px,calc(100vw - 36px));max-height:62vh;overflow:auto;background:#0c0b09f7;border:1px solid var(--line);box-shadow:0 10px 35px #000;border-radius:5px;padding:12px}.state-panel pre{font-size:10px;white-space:pre-wrap;color:#c7bda9}.hidden{display:none!important}
    .modal-backdrop{position:fixed;z-index:30;inset:0;background:#000b;display:grid;place-items:center}.modal{width:min(460px,calc(100vw - 30px));background:var(--panel2);border:1px solid #70453d;border-radius:6px;padding:22px;box-shadow:0 20px 70px #000}.modal h2{font:25px var(--serif);margin:0 0 8px}.modal p{color:var(--muted)}.modal .toolbar{justify-content:flex-end;margin-top:20px}
    @media(max-width:900px){.variant-note{display:none}.workbench{grid-template-columns:190px 1fr}.workbench .inspector{grid-column:1/-1;border-top:1px solid var(--line)}.rack-head{grid-template-columns:1fr 1fr}.outline-layout{grid-template-columns:1fr}.appbar{padding:0 12px;gap:8px}.nav button{padding:0 8px}.pagehead,.workspace{padding-left:14px;padding-right:14px}.sheet-grid{grid-template-columns:1fr}.switcher .variant-label{min-width:170px}.state-toggle{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // Three variants of the M2 configuration workspace, switchable via ?variant=.
    const sounds = [
      {name:'Ashen Crown Overture',source:'upload',tags:['music','battle']},
      {name:'Quiet Roads',source:'YouTube',tags:['music','travel']},
      {name:'Tavern at Dusk',source:'upload',tags:['music','tavern']},
      {name:'Whispering Pines',source:'upload',tags:['forest','night']},
      {name:'Rain on Canvas',source:'YouTube',tags:['rain','night']},
      {name:'Market Murmur',source:'upload',tags:['crowd','town']},
      {name:'Dragon Roar',source:'upload',tags:['monster','combat']},
      {name:'Steel Clash',source:'upload',tags:['combat']},
      {name:'Secret Door',source:'upload',tags:['dungeon']}
    ];
    const tags=[...new Set(sounds.flatMap(s=>s.tags))].sort();
    const seed=()=>({layers:[
      {id:'music',name:'Music',mode:'single',volume:72,color:'#d69a45',sets:[
        {id:'battle',name:'Battle score',tags:['battle'],loop:true,shuffle:true},
        {id:'travel',name:'On the road',tags:['travel'],loop:true,shuffle:false},
        {id:'tavern',name:'Tavern songs',tags:['tavern'],loop:true,shuffle:true}]},
      {id:'ambience',name:'Ambience',mode:'multiset',volume:58,color:'#6da7a5',sets:[
        {id:'forest',name:'Night forest',tags:['forest','night'],loop:true,shuffle:false},
        {id:'town',name:'Busy town',tags:['crowd','town'],loop:true,shuffle:false}]},
      {id:'sfx',name:'Sound effects',mode:'self_stacking',volume:84,color:'#bb7278',sets:[
        {id:'combat',name:'Combat hits',tags:['combat'],loop:false,shuffle:true},
        {id:'dungeon',name:'Dungeon details',tags:['dungeon'],loop:false,shuffle:false}]}
    ],selectedLayer:'music',selectedSet:'battle',selectedKind:'set'});
    let state=seed(), pendingDelete=null, rackConfirm=null, rackEditor=false, dirty=false, noteOpen=true, stateOpen=false;
    const variants={A:'Workbench',B:'Racks in context',C:'Outline + sheet'};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const variant=()=>{const v=new URLSearchParams(location.search).get('variant')?.toUpperCase();return variants[v]?v:'A'};
    const layer=()=>state.layers.find(x=>x.id===state.selectedLayer)||state.layers[0];
    const set=()=>layer()?.sets.find(x=>x.id===state.selectedSet)||layer()?.sets[0];
    const members=s=>sounds.filter(sound=>sound.tags.some(t=>s.tags.includes(t))).sort((a,b)=>a.name.localeCompare(b.name));
    const modeLabel=m=>({single:'Single set',multiset:'Multiset',self_stacking:'Multiset + self-stacking'})[m];
    function setUrl(v){const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState({},'',u);noteOpen=true;rackEditor=false;pendingDelete=null;render()}
    function cycle(n){const keys=Object.keys(variants),i=keys.indexOf(variant());setUrl(keys[(i+n+keys.length)%keys.length])}
    function select(layerId,setId=null,kind='layer'){state.selectedLayer=layerId;state.selectedSet=setId;state.selectedKind=kind;render()}
    function move(list,index,delta){const to=index+delta;if(to<0||to>=list.length)return;[list[index],list[to]]=[list[to],list[index]];dirty=true;render()}
    function addLayer(){const id='layer-'+Date.now();state.layers.push({id,name:'New layer',mode:'single',volume:80,color:'#9d8262',sets:[]});select(id,null,'layer')}
    function addSet(layerId){const l=state.layers.find(x=>x.id===layerId),id='set-'+Date.now();l.sets.push({id,name:'New set',tags:[],loop:false,shuffle:false});select(layerId,id,'set')}
    function removeTarget(){if(!pendingDelete)return;const {kind,layerId,setId}=pendingDelete;if(kind==='layer'){state.layers=state.layers.filter(x=>x.id!==layerId);state.selectedLayer=state.layers[0]?.id;state.selectedSet=state.layers[0]?.sets[0]?.id;state.selectedKind='layer'}else{const l=state.layers.find(x=>x.id===layerId);l.sets=l.sets.filter(x=>x.id!==setId);state.selectedSet=l.sets[0]?.id;state.selectedKind=l.sets.length?'set':'layer'}pendingDelete=null;rackConfirm=null;dirty=true;render()}
    function tagOptions(s){return tags.map(t=>`<label class="check"><input data-action="tag" data-tag="${t}" type="checkbox" ${s.tags.includes(t)?'checked':''}><span><span class="tag">${esc(t)}</span></span></label>`).join('')}
    function membership(s){const found=members(s);return `<div class="membership"><div class="row"><strong style="flex:1">Resolved membership</strong><span class="count">${found.length} sound${found.length===1?'':'s'} · any selected tag</span></div><p class="help">Preview only. Playback and live status arrive with Session in M3.</p>${found.length?found.map(x=>`<div class="sound"><span>${esc(x.name)}</span><span class="source">${x.source}</span></div>`).join(''):`<div class="zero">No Library sounds match yet. Add a tag here or tag sounds in the Sound Library.</div>`}</div>`}
    function orderButtons(kind,l,i){return `<span class="order"><button data-action="move" data-kind="${kind}" data-layer="${l.id}" data-index="${i}" data-delta="-1" aria-label="Move up">↑</button><button data-action="move" data-kind="${kind}" data-layer="${l.id}" data-index="${i}" data-delta="1" aria-label="Move down">↓</button></span>`}
    function modeSelect(l){return `<select data-change="mode" data-layer="${l.id}"><option value="single" ${l.mode==='single'?'selected':''}>Single set</option><option value="multiset" ${l.mode==='multiset'?'selected':''}>Multiset</option><option value="self_stacking" ${l.mode==='self_stacking'?'selected':''}>Multiset + self-stacking</option></select>`}
    function appHeader(){return `<div class="prototype-banner">Throwaway prototype · in-memory only · no audio or live triggering</div><header class="appbar"><div class="brand">Electro<b>Bard</b></div><nav class="nav"><button data-action="library">Sound Library</button><button class="active">Layers & Sets</button><button class="future" data-action="session">Session <span class="future-badge">M3</span></button></nav><span class="spacer"></span><button class="reset" data-action="reset">Reset data</button></header><div class="pagehead"><div><div class="eyebrow">Configuration workspace</div><h1>Layers & Sets</h1><p>Shape the channels and cues you’ll use later in Session. Nothing plays from this workspace.</p></div><button class="primary" data-action="add-layer">+ New layer</button></div>`}
    function inspector(l,s){if(!l)return `<div class="empty"><strong>No layers yet</strong>Create a layer to begin organizing your sets.<br><button class="primary" data-action="add-layer">+ New layer</button></div>`;const target=state.selectedKind==='set'&&s?s:null;return target?`<div class="inspector"><div class="eyebrow">Set settings</div><h2>${esc(target.name)}</h2><label class="field"><span>Name</span><input type="text" value="${esc(target.name)}" data-change="set-name" data-layer="${l.id}" data-set="${target.id}"></label><div class="field"><span>Include sounds tagged</span><div style="display:grid;grid-template-columns:1fr 1fr">${tagOptions(target)}</div><span class="help">OR matching: a sound with any selected tag belongs to this set.</span></div><label class="check"><input type="checkbox" data-change="loop" data-layer="${l.id}" data-set="${target.id}" ${target.loop?'checked':''}><span><strong>Loop</strong><br><span class="help">Repeat after the final sound.</span></span></label><label class="check"><input type="checkbox" data-change="shuffle" data-layer="${l.id}" data-set="${target.id}" ${target.shuffle?'checked':''}><span><strong>Shuffle</strong><br><span class="help">Randomize again on each loop.</span></span></label>${membership(target)}<div class="danger-zone"><button class="ghost danger" data-action="ask-delete" data-kind="set" data-layer="${l.id}" data-set="${target.id}">Delete set…</button></div></div>`:`<div class="inspector"><div class="eyebrow">Layer settings</div><h2>${esc(l.name)}</h2><label class="field"><span>Name</span><input type="text" value="${esc(l.name)}" data-change="layer-name" data-layer="${l.id}"></label><label class="field"><span>Playback mode</span>${modeSelect(l)}<span class="help">Defines how this layer behaves later in Session.</span></label><label class="field"><span>Volume · ${l.volume}%</span><input type="range" min="0" max="100" value="${l.volume}" data-change="volume" data-layer="${l.id}"></label><div class="danger-zone"><strong>Delete layer</strong><p>Also deletes its ${l.sets.length} set${l.sets.length===1?'':'s'}. Library sounds stay untouched.</p><button class="secondary danger" data-action="ask-delete" data-kind="layer" data-layer="${l.id}">Delete layer…</button></div></div>`}
    function variantA(){const l=layer(),s=set();return `<div class="workspace"><div class="panel workbench"><section class="pane"><div class="panel-title"><span>Layers</span><span>${state.layers.length}</span></div>${state.layers.length?state.layers.map((x,i)=>`<div class="layer-item ${x.id===l?.id?'active':''}" data-action="select-layer" data-layer="${x.id}"><div class="item-top"><span class="grip">⠿</span><strong>${esc(x.name)}</strong>${orderButtons('layer',x,i)}</div><div class="subtle">${modeLabel(x.mode)} · ${x.sets.length} sets</div></div>`).join(''):`<div class="empty">No layers</div>`}<div style="padding:12px"><button class="secondary" data-action="add-layer">+ Layer</button></div></section><section class="pane"><div class="sets-head"><div><div class="title">${l?esc(l.name):'Sets'}</div><div class="subtle">${l?`${l.sets.length} configured cues`:'Choose a layer'}</div></div>${l?`<button class="secondary" data-action="add-set" data-layer="${l.id}">+ Set</button>`:''}</div>${l?(l.sets.length?l.sets.map((x,i)=>`<div class="set-item ${state.selectedKind==='set'&&x.id===s?.id?'active':''}" data-action="select-set" data-layer="${l.id}" data-set="${x.id}"><div class="item-top"><span class="grip">⠿</span><strong>${esc(x.name)}</strong>${orderButtons('set',l,i)}</div><div class="subtle">${x.tags.map(t=>`#${esc(t)}`).join(' · ')||'No tags'} · ${members(x).length} sounds</div></div>`).join(''):`<div class="empty"><strong>No sets in ${esc(l.name)}</strong>Sets group Library sounds by tag.<br><button class="primary" data-action="add-set" data-layer="${l.id}">Create first set</button></div>`):`<div class="empty"><strong>No layers yet</strong>Create your first channel.</div>`}</section><section>${inspector(l,s)}</section></div></div>`}
    function variantB(){return `<div class="workspace racks">${state.layers.length?state.layers.map((l,li)=>`<section class="rack" style="--accent:${l.color}"><div class="rack-head"><div class="row"><span class="grip">⠿</span><div><input class="rack-name" aria-label="Layer name" value="${esc(l.name)}" data-change="layer-name" data-layer="${l.id}"><span class="subtle">${l.sets.length} sets</span></div>${orderButtons('layer',l,li)}</div><label class="mini-field"><span>Playback later</span>${modeSelect(l)}</label><label class="mini-field"><span>Volume · ${l.volume}%</span><input type="range" min="0" max="100" value="${l.volume}" data-change="volume" data-layer="${l.id}"></label><button class="ghost danger" data-action="rack-delete" data-kind="layer" data-layer="${l.id}">Delete</button></div>${rackConfirm===`layer:${l.id}`?inlineConfirm('layer',l):''}<div class="sets-strip">${l.sets.map((s,si)=>`<article class="set-card"><div class="card-top"><span class="grip">⠿</span><h3>${esc(s.name)}</h3>${orderButtons('set',l,si)}<button class="ghost danger" data-action="rack-delete" data-kind="set" data-layer="${l.id}" data-set="${s.id}">×</button></div><div>${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'<span class="help">No tags selected</span>'}</div><div class="membership-line">${members(s).length} matching sounds · ${s.loop?'Loop':'One pass'} · ${s.shuffle?'Shuffle':'A→Z'}</div><button class="secondary" style="margin-top:10px" data-action="select-set-modal" data-layer="${l.id}" data-set="${s.id}">Edit details</button>${rackConfirm===`set:${s.id}`?inlineConfirm('set',l,s):''}</article>`).join('')}<button class="set-card add" data-action="add-set" data-layer="${l.id}">+ Add set to ${esc(l.name)}</button></div></section>`).join(''):`<div class="panel empty"><strong>Your configuration is empty</strong>The Sound Library is still safe. Create a layer to start arranging cues.<br><button class="primary" data-action="add-layer">Create first layer</button></div>`}</div>${rackEditor?rackEditorModal():''}`}
    function rackEditorModal(){const l=layer(),s=set();if(!l||!s)return'';return `<div class="modal-backdrop"><div class="modal" style="width:min(720px,calc(100vw - 30px));max-height:90vh;overflow:auto"><div class="row"><div style="flex:1"><div class="eyebrow">${esc(l.name)} · set details</div><h2>Edit ${esc(s.name)}</h2></div><button class="ghost" data-action="close-editor">× Close</button></div><label class="field"><span>Name</span><input type="text" value="${esc(s.name)}" data-change="set-name" data-layer="${l.id}" data-set="${s.id}"></label><div class="field"><span>Include sounds tagged</span><div style="display:grid;grid-template-columns:repeat(3,1fr)">${tagOptions(s)}</div></div><div class="row"><label class="check"><input type="checkbox" data-change="loop" data-layer="${l.id}" data-set="${s.id}" ${s.loop?'checked':''}><span><strong>Loop</strong></span></label><label class="check"><input type="checkbox" data-change="shuffle" data-layer="${l.id}" data-set="${s.id}" ${s.shuffle?'checked':''}><span><strong>Shuffle</strong></span></label></div>${membership(s)}</div></div>`}
    function inlineConfirm(kind,l,s){const name=kind==='layer'?l.name:s.name;return `<div class="inline-confirm">Delete <strong>${esc(name)}</strong>? ${kind==='layer'?`Its ${l.sets.length} sets will also go. `:''}Library sounds are not deleted.<div class="toolbar"><button class="ghost" data-action="cancel-delete">Cancel</button><button class="secondary danger" data-action="confirm-inline" data-kind="${kind}" data-layer="${l.id}" data-set="${s?.id||''}">Yes, delete</button></div></div>`}
    function variantC(){const l=layer(),s=set(),target=state.selectedKind==='set'&&s?s:null;return `<div class="workspace outline-layout"><aside class="panel tree"><div class="panel-title"><span>Configuration outline</span><button class="icon-btn" data-action="add-layer">+</button></div>${state.layers.length?state.layers.map((x,li)=>`<div class="tree-layer"><div class="tree-row ${x.id===l?.id&&state.selectedKind==='layer'?'active':''}" data-action="select-layer" data-layer="${x.id}"><span>▾</span><strong>${esc(x.name)}</strong><span class="count">${x.sets.length}</span>${orderButtons('layer',x,li)}</div><div class="tree-set">${x.sets.map((q,si)=>`<div class="tree-row ${q.id===s?.id&&state.selectedKind==='set'?'active':''}" data-action="select-set" data-layer="${x.id}" data-set="${q.id}"><span>◇</span><span class="name">${esc(q.name)}</span><span class="count">${members(q).length}</span>${orderButtons('set',x,si)}</div>`).join('')}<button class="ghost" data-action="add-set" data-layer="${x.id}">+ Set</button></div></div>`).join(''):`<div class="empty"><strong>Blank outline</strong><button class="primary" data-action="add-layer">Create layer</button></div>`}</aside><main class="panel sheet">${!l?`<div class="empty"><strong>Select or create a layer</strong></div>`:target?sheetSet(l,target):sheetLayer(l)}</main></div>`}
    function sheetLayer(l){return `<div class="sheet-head"><div><div class="breadcrumb">LAYERS / ${esc(l.name).toUpperCase()}</div><h2>${esc(l.name)}</h2><span class="mode-pill">Layer settings</span></div><button class="secondary danger" data-action="ask-delete" data-kind="layer" data-layer="${l.id}">Delete…</button></div><div class="sheet-grid"><label class="field"><span>Name</span><input type="text" value="${esc(l.name)}" data-change="layer-name" data-layer="${l.id}"></label><label class="field"><span>Playback mode</span>${modeSelect(l)}</label><label class="field"><span>Volume · ${l.volume}%</span><input type="range" min="0" max="100" value="${l.volume}" data-change="volume" data-layer="${l.id}"></label><div class="session-callout"><strong>Session controls are not here</strong><br><span class="help">Triggering, playing status, and live mixing arrive in M3.</span></div></div><div class="savebar"><span>${dirty?'● Unsaved changes':'All changes saved'}</span><button class="primary" data-action="save">Save configuration</button></div>`}
    function sheetSet(l,s){return `<div class="sheet-head"><div><div class="breadcrumb">${esc(l.name).toUpperCase()} / SETS / ${esc(s.name).toUpperCase()}</div><h2>${esc(s.name)}</h2><span class="mode-pill">Tag-derived set</span></div><button class="secondary danger" data-action="ask-delete" data-kind="set" data-layer="${l.id}" data-set="${s.id}">Delete…</button></div><div class="sheet-grid"><label class="field"><span>Name</span><input type="text" value="${esc(s.name)}" data-change="set-name" data-layer="${l.id}" data-set="${s.id}"></label><div><label class="check"><input type="checkbox" data-change="loop" data-layer="${l.id}" data-set="${s.id}" ${s.loop?'checked':''}><span><strong>Loop</strong><br><span class="help">Repeat continuously.</span></span></label><label class="check"><input type="checkbox" data-change="shuffle" data-layer="${l.id}" data-set="${s.id}" ${s.shuffle?'checked':''}><span><strong>Shuffle</strong><br><span class="help">Re-randomize each loop.</span></span></label></div><div class="field"><span>Include sounds tagged</span><div style="display:grid;grid-template-columns:repeat(2,1fr)">${tagOptions(s)}</div><div class="help">Any selected tag matches (OR).</div></div>${membership(s)}</div><div class="savebar"><span>${dirty?'● Unsaved changes':'All changes saved'}</span><button class="primary" data-action="save">Save configuration</button></div>`}
    function chrome(v){return `${noteOpen?`<aside class="variant-note"><button data-action="close-note">×</button><strong>${v}: ${variants[v]}</strong><p>${v==='A'?'Selection stays put while a dedicated inspector handles edits. Fast focus, but only one layer is visible.':v==='B'?'All layers and sets stay visible; common controls edit inline. Great overview, more visual density.':'A compact hierarchy optimizes reorder and navigation; the settings sheet uses an explicit save model.'}</p></aside>`:''}<button class="state-toggle" data-action="toggle-state">${stateOpen?'Hide':'Show'} prototype state</button>${stateOpen?`<aside class="state-panel"><strong>Full in-memory state</strong><pre>${esc(JSON.stringify(state,null,2))}</pre></aside>`:''}<div class="switcher"><button data-action="cycle" data-delta="-1" aria-label="Previous variant">←</button><div class="variant-label">${v} · ${variants[v]}<small>?variant=${v} · arrow keys switch</small></div><button data-action="cycle" data-delta="1" aria-label="Next variant">→</button></div>`}
    function deleteModal(){if(!pendingDelete)return'';const l=state.layers.find(x=>x.id===pendingDelete.layerId),s=l?.sets.find(x=>x.id===pendingDelete.setId),name=pendingDelete.kind==='layer'?l?.name:s?.name;return `<div class="modal-backdrop"><div class="modal"><div class="eyebrow">Destructive action</div><h2>Delete ${esc(name||'item')}?</h2><p>${pendingDelete.kind==='layer'?`This removes the layer and its ${l.sets.length} sets. `:''}The sounds in your Library are not affected.</p><div class="toolbar"><button class="ghost" data-action="cancel-delete">Cancel</button><button class="primary danger" data-action="confirm-delete">Delete permanently</button></div></div></div>`}
    function render(){const v=variant();document.getElementById('app').innerHTML=`<div class="shell">${appHeader()}${v==='A'?variantA():v==='B'?variantB():variantC()}${chrome(v)}${deleteModal()}</div>`}
    document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,lid=b.dataset.layer,sid=b.dataset.set;
      if(a==='cycle')cycle(Number(b.dataset.delta));else if(a==='close-note'){noteOpen=false;render()}else if(a==='toggle-state'){stateOpen=!stateOpen;render()}else if(a==='reset'){state=seed();dirty=false;render()}else if(a==='add-layer')addLayer();else if(a==='add-set')addSet(lid);else if(a==='select-layer')select(lid,null,'layer');else if(a==='select-set')select(lid,sid,'set');else if(a==='select-set-modal'){state.selectedLayer=lid;state.selectedSet=sid;state.selectedKind='set';rackEditor=true;render()}else if(a==='close-editor'){rackEditor=false;render()}else if(a==='move'){const l=state.layers.find(x=>x.id===lid);move(b.dataset.kind==='layer'?state.layers:l.sets,Number(b.dataset.index),Number(b.dataset.delta))}else if(a==='ask-delete'){pendingDelete={kind:b.dataset.kind,layerId:lid,setId:sid};render()}else if(a==='confirm-delete')removeTarget();else if(a==='cancel-delete'){pendingDelete=null;rackConfirm=null;render()}else if(a==='rack-delete'){rackConfirm=`${b.dataset.kind}:${b.dataset.kind==='layer'?lid:sid}`;render()}else if(a==='confirm-inline'){pendingDelete={kind:b.dataset.kind,layerId:lid,setId:sid};removeTarget()}else if(a==='save'){dirty=false;render()}else if(a==='library')alert('Boundary check: Sound Library owns sounds, source details, preview, and sound tags. This prototype does not navigate away.');else if(a==='session')alert('Session is intentionally unavailable until M3. This workspace configures what Session will later perform.');});
    document.addEventListener('change',e=>{const el=e.target,k=el.dataset.change;if(!k&&el.dataset.action!=='tag')return;const l=state.layers.find(x=>x.id===el.dataset.layer)||layer(),s=l?.sets.find(x=>x.id===el.dataset.set)||set();if(k==='layer-name')l.name=el.value||'Untitled layer';if(k==='set-name')s.name=el.value||'Untitled set';if(k==='mode')l.mode=el.value;if(k==='volume')l.volume=Number(el.value);if(k==='loop')s.loop=el.checked;if(k==='shuffle')s.shuffle=el.checked;if(el.dataset.action==='tag'){const t=el.dataset.tag;s.tags=el.checked?[...new Set([...s.tags,t])]:s.tags.filter(x=>x!==t)}dirty=true;render()});
    document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
    window.addEventListener('popstate',render);render();
  </script>
</body>
</html>
